# MEDS-S1 -- pre-commit hooks
# Run `pip install pre-commit && pre-commit install` once per clone to enable.

repos:
  # Official, well-tested hooks for the two common whitespace issues.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        stages: [commit]

      - id: trailing-whitespace
        stages: [commit]

  # Tabs -> 4 spaces. No standard hook for this (it's convention-specific),
  # so it's a small local hook using the POSIX `expand` utility.
  - repo: local
    hooks:
      - id: tabs-to-spaces
        name: convert tabs to 4 spaces
        entry: bash -c 'for f in "$@"; do expand -t 4 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done' --
        language: system
        files: '\.(py|sv|svh)$'
        stages: [commit]

  # Gates below call the Makefile targets, so CI and local commits
  # run exactly the same checks. Order matters: fixers above run first.
      - id: verilator-lint
        name: verilator lint (make lint)
        entry: make lint
        language: system
        files: '\.(sv|svh)$'
        pass_filenames: false
        require_serial: true
        stages: [commit]

      - id: verible-check
        name: verible lint + format check (make verible-check)
        entry: make verible-check
        language: system
        files: '\.(sv|svh)$'
        pass_filenames: false
        require_serial: true
        stages: [commit]
